name: Remove deprecated RIMA sections

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rima-remove-sections.yml

permissions:
  contents: write

jobs:
  clean-markup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove obsolete sections from source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("rima-one-20260910")

          index_path = root / "index.html"
          html = index_path.read_text()
          html, manifesto_count = re.subn(
              r'\n      <section class="manifesto section">.*?\n      </section>\n',
              "",
              html,
              count=1,
              flags=re.S,
          )
          html, pricing_count = re.subn(
              r'\n            <img\n              class="pricing-art reveal".*?\n            />\n',
              "\n",
              html,
              count=1,
              flags=re.S,
          )
          assert manifesto_count == 1, manifesto_count
          assert pricing_count == 1, pricing_count
          assert 'class="manifesto section"' not in html
          assert 'class="pricing-art reveal"' not in html
          index_path.write_text(html)

          app_path = root / "app.js"
          app = app_path.read_text()
          cleanup = (
              '  document.querySelector(".pricing-art")?.remove();\n'
              '  document.querySelector(".manifesto")?.remove();\n\n'
          )
          assert cleanup in app
          app_path.write_text(app.replace(cleanup, "", 1))

          motion_path = root / "orbit-motion.css"
          motion = motion_path.read_text()
          pricing_rule = (
              '/* Plans reflow after removing the source pricing poster. */\n'
              '.pricing-art {\n'
              '  display: none !important;\n'
              '}\n\n'
          )
          manifesto_rule = (
              '\n/* The manifesto section was removed from the final composition. */\n'
              '.manifesto {\n'
              '  display: none !important;\n'
              '}\n'
          )
          assert pricing_rule in motion
          assert manifesto_rule in motion
          motion = motion.replace(pricing_rule, "/* Plans reflow after removing the source pricing poster. */\n", 1)
          motion = motion.replace(manifesto_rule, "", 1)
          motion_path.write_text(motion)
          PY

      - name: Commit cleaned source
        run: |
          rm -f .github/workflows/rima-remove-sections.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rima-one-20260910/index.html rima-one-20260910/app.js rima-one-20260910/orbit-motion.css .github/workflows/rima-remove-sections.yml
          git commit -m "Remove obsolete RIMA sections from markup"
          git push origin HEAD:main
