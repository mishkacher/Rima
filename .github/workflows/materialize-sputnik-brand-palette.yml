name: Materialize Sputnik brand palette

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-sputnik-brand-palette.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize audited production files
        shell: bash
        run: |
          set -euo pipefail
          cat .sputnik-brand-palette.part-* > /tmp/sputnik-brand-palette.b64
          base64 -d /tmp/sputnik-brand-palette.b64 > /tmp/sputnik-brand-palette.tar.gz
          echo "77d27f935672b090f000415b2db73d128e15f234bb09e1d0024847f4ab03134c  /tmp/sputnik-brand-palette.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sputnik-brand-palette.tar.gz
          grep -q -- '#f1eddc' sputnik-signal-20260910/style.css
          grep -q -- 'logo-emblem' sputnik-signal-20260910/index.html
          if grep -q -- '#c8ff19' sputnik-signal-20260910/style.css; then
            echo "Legacy acid color still present"
            exit 1
          fi
          rm -f .sputnik-brand-palette.part-*
          rm -f .github/workflows/materialize-sputnik-brand-palette.yml
      - name: Commit audited production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore original palette and add orbit monogram"
          git push origin HEAD:main
