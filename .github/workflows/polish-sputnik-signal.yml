name: Polish Sputnik Signal site

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/polish-sputnik-signal.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair copy and mobile typography
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path("sputnik-signal-20260910/index.html")
          html = html_path.read_text()
          html = html.replace("\ufffd", "")
          html = html.replace("каждй", "каждый")
          html = html.replace("седующий", "следующий")
          html = html.replace("<wbr />", "")
          if "\ufffd" in html:
              raise SystemExit("Replacement character remains in HTML")
          if "каждый следующий" not in " ".join(html.split()):
              raise SystemExit("Corrected sentence was not produced")
          html_path.write_text(html)

          css_path = Path("sputnik-signal-20260910/style.css")
          css = css_path.read_text()
          marker = "/* final mobile type integrity */"
          if marker not in css:
              css += """

          /* final mobile type integrity */
          @media (max-width: 560px) {
            .mega-heading {
              font-size: clamp(44px, 14.5vw, 70px);
            }
            .plans .section-title {
              font-size: clamp(48px, 15.5vw, 76px);
            }
          }
          """
          css_path.write_text(css)
          PY

          rm -f .github/workflows/polish-sputnik-signal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Fix Sputnik Signal copy and mobile type"
          git push
