name: RIMA QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Static smoke audit
        run: python tests/smoke.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Import pinned official imagery
        run: python scripts/import_official_assets.py
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Browser smoke and visual captures
        run: node tests/browser-smoke.mjs
      - name: Upload concept captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rima-ten-concepts
          path: artifacts/browser-qa
          if-no-files-found: ignore
