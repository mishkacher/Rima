name: Deploy RIMA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialize final single RIMA site
        env:
          BUNDLE_URL: "https://prod-files-secure.s3.us-west-2.amazonaws.com/1e5cf677-bbc8-81f5-838b-0003e2a1234c/34ab9836-f7b4-4a6e-8bbf-2bfb470b9bca/rima-one-direct.zip?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&X-Amz-Credential=ASIAZI2LB466U54KODTG%2F20260909%2Fus-west-2%2Fs3%2Faws4_request&X-Amz-Date=20260909T185310Z&X-Amz-Expires=3600&X-Amz-Security-Token=IQoJb3JpZ2luX2VjEKn%2F%2F%2F%2F%2F%2F%2F%2F%2F%2FwEaCXVzLXdlc3QtMiJIMEYCIQC0pAobdSG4iZGnG5vgFLdoF1RDlKgOJcy2l1MfP0kJjQIhAMynwVxdxyqybuiVLQIrb59S5s63XtxPhVHuF%2FhQvaCWKv8DCHIQABoMNjM3NDIzMTgzODA1IgzkG4WsfN%2FNTfXF9jkq3ANxsZPue0Sk1UfT36huqw17RlueV2V%2BqV3GXSpkGDZod%2FxGiAR2wepcSc%2Bh09R5PmBauoAnP3M%2FORpoYjmFbTlagEmaAB7%2FNdiAzeDeXPXqKPwUnN8WASLpt2MhefKn02q6JBu2h3%2FPAJmKOzPEFydK4LnEiOQIepIzpWrLrwZ7tv5lH0uLBWBjeO%2FN19Mh6wFld%2BpngLbtVtXGyUSqZ4bQ8%2FvuBbk0dVhObJw1rJ4wdgaBvI5TzAUMth2Fr1INVHEfGoQVacgEo1IrC1gkqbV9lijYUVTdh7u9pLhqtJ8ITcr4FAgDbBZAKi%2FZi0UaJoYFBCQPMK%2BjHZJbdTEdIUVnNOlicsv5JW%2B3Hbu8Rif0djh%2BBc1jYR3DtO0Q%2FkQkri3RA7kkEAxgOpU6NVy%2FckQqpHiS1NlzyGgcDN3QhLrjK8tmcrExLd39k3uFhU%2B3KtGIgWQeoS77XFOtuaOLT2%2BPxZRry25E3hpkoFPNVgSHwmxcvvNpqZsAsc2QykZ9fUrTGZmwJgoABw%2BPFyw4l%2BBE83ZBGfvJQbzYf6e%2FqFIjZ7e9gtG%2BQMeStIGtYhUUd4njRwKx5y0LtoDQlsGMKoJa0lvzKADxQpNxdIhyC8VQHTcEshNbKRlJIRZ9JDDQo4bVBjqkAVUZ%2FgAz50w%2Be1i%2BfngAsQSt7oa3CmSwsX1CQ19heemceIxHIwaK3rrhHexeN9%2BytEBHYfLcSSwzPHLbTtPThaFJXdjQc9yIR3WZ8lnobD%2BkezgMMTZh0EIxBVx%2BXlzx9vOCky%2BPEJwRRIUmCsnbWQ%2FLxtyyXwgUD71QcIQk70HxxynVHyEQ07QHZeFSj6DleriJ4YGVi0Zpm11UlPK61SlvCukF&X-Amz-Signature=b72511527a7414c614352dde400713b8c842f1106447119af0ec22c1e705620c&X-Amz-SignedHeaders=host&x-amz-checksum-mode=ENABLED&x-id=GetObject"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$BUNDLE_URL" -o /tmp/rima-one-direct.zip
          echo "cb3d9bc002e323572d468d999023e18a26592752bc9deda5bb53ccbed949bb1c  /tmp/rima-one-direct.zip" | sha256sum --check -
          unzip -tq /tmp/rima-one-direct.zip
          rm -rf rima-one-20260910
          unzip -q /tmp/rima-one-direct.zip -d .
          test -f rima-one-20260910/index.html
          test -f rima-one-20260910/style.css
          test -f rima-one-20260910/app.js
          test -f rima-one-20260910/AUDIT.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rima-one-20260910
          if ! git diff --cached --quiet; then
            git commit -m "Deploy final single RIMA site [skip ci]"
            git push
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Import pinned official imagery
        run: python scripts/import_official_assets.py

      - name: Import BAD HABITS production
        run: |
          rm -rf BAD-HABITS /tmp/bad-habits-site
          git clone --depth 1 --branch gh-pages https://github.com/MishkaStrategy/BAD-HABITS.git /tmp/bad-habits-site
          mkdir -p BAD-HABITS
          cp -R /tmp/bad-habits-site/. BAD-HABITS/
          touch BAD-HABITS/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
