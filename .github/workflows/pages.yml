name: Deploy RIMA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialize final single RIMA site
        shell: bash
        run: |
          set -euo pipefail
          PAGE_ID="3aa6a49b-9d47-4c74-a3dd-2a05f393004c"
          PAGE_URL="https://www.notion.so/3aa6a49b9d474c74a3dd2a05f393004c"
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          page_id = "3aa6a49b-9d47-4c74-a3dd-2a05f393004c"
          payload = {
              "pageId": page_id,
              "limit": 100,
              "cursor": {"stack": []},
              "chunkNumber": 0,
              "verticalColumns": False,
          }
          headers = {
              "content-type": "application/json",
              "user-agent": "Mozilla/5.0",
          }
          for index, endpoint in enumerate((
              "https://www.notion.so/api/v3/loadCachedPageChunk",
              "https://www.notion.so/api/v3/loadPageChunk",
          )):
              try:
                  request = urllib.request.Request(
                      endpoint,
                      data=json.dumps(payload).encode(),
                      headers=headers,
                  )
                  with urllib.request.urlopen(request, timeout=60) as stream:
                      pathlib.Path(f"/tmp/notion-api-{index}.json").write_bytes(stream.read())
              except Exception as error:
                  pathlib.Path(f"/tmp/notion-api-{index}.error").write_text(type(error).__name__)
          PY
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -n "$BROWSER" ]; then
            "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=20000 \
              --dump-dom "$PAGE_URL" > /tmp/notion-page.html 2>/tmp/notion-browser.log || true
          fi
          python3 - <<'PY'
          import hashlib
          import html
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          expected = "0c541fd8f9da246425baa58e8ac3a16d5f43ec1c2990bbe93e8631568298524e"
          corpus = ""
          for path in list(pathlib.Path("/tmp").glob("notion-api-*.json")) + [pathlib.Path("/tmp/notion-page.html")]:
              if path.exists():
                  corpus += "\n" + path.read_text(errors="ignore")
          variants = [corpus]
          for _ in range(3):
              current = variants[-1]
              variants.append(
                  html.unescape(current)
                  .replace("\\u002F", "/")
                  .replace("\\u002f", "/")
                  .replace("\\u0026", "&")
                  .replace("\\/", "/")
              )
              variants.append(urllib.parse.unquote(variants[-1]))
          urls = []
          for value in variants:
              urls.extend(re.findall(r"https?://[^\s<>'\"\\]+", value))
          candidates = []
          for url in urls:
              url = url.rstrip("),.;]")
              if (
                  ".zip" in url.lower()
                  or "prod-files-secure" in url
                  or "notion-static.com" in url
                  or "file.notion.so" in url
              ):
                  if url not in candidates:
                      candidates.append(url)
          headers = {"user-agent": "Mozilla/5.0"}
          for url in candidates:
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=120) as source:
                      payload = source.read()
                  if hashlib.sha256(payload).hexdigest() == expected:
                      pathlib.Path("/tmp/rima-one-site.zip").write_bytes(payload)
                      print("Verified final RIMA bundle")
                      break
              except Exception:
                  continue
          else:
              raise SystemExit(f"Final bundle not resolved from {len(candidates)} candidates")
          PY
          unzip -tq /tmp/rima-one-site.zip
          rm -rf rima-one-20260910
          unzip -q /tmp/rima-one-site.zip -d .
          test -f rima-one-20260910/index.html
          test -f rima-one-20260910/AUDIT.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rima-one-20260910
          if ! git diff --cached --quiet; then
            git commit -m "Deploy final single RIMA site [skip ci]"
            git push
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Import pinned official imagery
        run: python scripts/import_official_assets.py

      - name: Import BAD HABITS production
        run: |
          rm -rf BAD-HABITS /tmp/bad-habits-site
          git clone --depth 1 --branch gh-pages https://github.com/MishkaStrategy/BAD-HABITS.git /tmp/bad-habits-site
          mkdir -p BAD-HABITS
          cp -R /tmp/bad-habits-site/. BAD-HABITS/
          touch BAD-HABITS/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
