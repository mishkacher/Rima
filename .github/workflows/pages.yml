name: Deploy RIMA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Import pinned official imagery
        run: python scripts/import_official_assets.py

      - name: Import BAD HABITS production
        run: |
          rm -rf BAD-HABITS /tmp/bad-habits-site
          git clone --depth 1 --branch gh-pages https://github.com/MishkaStrategy/BAD-HABITS.git /tmp/bad-habits-site
          mkdir -p BAD-HABITS
          cp -R /tmp/bad-habits-site/. BAD-HABITS/
          touch BAD-HABITS/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
